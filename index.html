<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดเก็บรูปภาพงานโสตทัศนูปกรณ์ - ศูนย์การศึกษาพิเศษ เขตการศึกษา 3 จังหวัดสงขลา</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-blue-500 selection:text-white pb-20">

  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-blue-400/15 to-indigo-400/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-400/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- เปลี่ยนชื่อหัวเว็บไซต์ที่นี่ -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 ring-4 ring-blue-50 flex-shrink-0">
          <i data-lucide="camera" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">ระบบจัดเก็บรูปภาพงานโสตทัศนูปกรณ์</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">ศูนย์การศึกษาพิเศษ เขตการศึกษา 3 จังหวัดสงขลา</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-64">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="searchInput" placeholder="ค้นหาชื่องาน..." class="w-full pl-9 pr-4 py-2 bg-slate-100/80 hover:bg-slate-100 focus:bg-white text-sm rounded-xl border border-transparent focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all"/>
        </div>
        <div class="relative">
          <select id="monthFilter" class="appearance-none pl-3.5 pr-9 py-2 bg-white text-sm font-medium text-slate-700 rounded-xl border border-slate-200 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 cursor-pointer">
            <option value="all">📁 ทุกแฟ้ม</option>
          </select>
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading" class="flex flex-col items-center justify-center py-28 space-y-4">
      <div class="relative flex items-center justify-center">
        <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
      </div>
      <div class="text-center">
        <p class="text-sm font-medium text-slate-600">กำลังเชื่อมต่อฐานข้อมูลภาพถ่าย...</p>
      </div>
    </div>

    <!-- Gallery Container -->
    <div id="gallery-container" class="space-y-12"></div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="relative max-w-6xl w-full flex flex-col items-center">
      <div class="absolute top-4 right-4 z-50 flex gap-2">
        <a id="modalDownloadBtn" href="#" target="_blank" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white transition-colors" title="ดาวน์โหลด">
          <i data-lucide="download" class="w-5 h-5"></i>
        </a>
        <button onclick="closeLightbox()" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white transition-colors" title="ปิดหน้าต่าง">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <img id="modalImage" src="" alt="preview" class="max-h-[85vh] object-contain rounded-lg shadow-2xl select-none" />
      <p id="modalImageName" class="text-sm font-medium text-slate-300 mt-4 text-center truncate max-w-xl"></p>
    </div>
  </div>

  <script>
    // ==========================================
    // นำลิงก์ Web App URL /exec มาใส่ในบรรทัดด้านล่าง
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzxI30uAvNXWPm04GzT803itEvdwJsqML23eiHDMQLmDEbB13o6_PI3wHmH9sMQK9hB/exec";

    let galleryData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        galleryData = data;
        document.getElementById('loading').classList.add('hidden');
        buildFilterOptions();
        renderGallery(galleryData);
      } catch (err) {
        document.getElementById('loading').innerHTML = `<div class="text-red-500 font-medium">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
      }
    }

    function buildFilterOptions() {
      const select = document.getElementById('monthFilter');
      select.innerHTML = '<option value="all">📁 แสดงทั้งหมด</option>';
      galleryData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.month;
        opt.textContent = `📁 ${item.month}`;
        select.appendChild(opt);
      });

      select.addEventListener('change', filterAndRender);
      document.getElementById('searchInput').addEventListener('input', filterAndRender);
    }

    function filterAndRender() {
      const selectedMonth = document.getElementById('monthFilter').value;
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = JSON.parse(JSON.stringify(galleryData));

      if (selectedMonth !== 'all') {
        filtered = filtered.filter(item => item.month === selectedMonth);
      }

      if (searchKeyword) {
        filtered = filtered.map(group => {
          const matchingEvents = group.events.filter(event => event.name.toLowerCase().includes(searchKeyword));
          return { ...group, events: matchingEvents };
        }).filter(group => group.events.length > 0);
      }

      renderGallery(filtered);
    }

    function renderGallery(dataset) {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      if (!dataset || dataset.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-slate-400"><p>ไม่พบข้อมูล</p></div>`;
        return;
      }

      dataset.forEach((folderGroup, groupIndex) => {
        const section = document.createElement('section');
        section.className = 'space-y-6';

        const header = document.createElement('div');
        header.className = 'flex items-center gap-2 pb-2 border-b border-slate-200';
        header.innerHTML = `
          <div class="p-1.5 bg-blue-100 text-blue-700 rounded-lg"><i data-lucide="folder-open" class="w-5 h-5"></i></div>
          <h2 class="text-lg font-bold text-slate-800">${folderGroup.month}</h2>
        `;
        section.appendChild(header);

        // ตาราง Grid จัดเรียงอัลบั้ม (แสดงเป็นหน้าปก)
        const albumGrid = document.createElement('div');
        albumGrid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

        folderGroup.events.forEach((event, eventIndex) => {
          const coverPhoto = event.photos[0]; // ใช้รูปแรกเป็นหน้าปกอัลบั้ม
          const albumId = `album-${groupIndex}-${eventIndex}`;

          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col group';

          card.innerHTML = `
            <!-- ปกอัลบั้ม -->
            <div class="relative aspect-[4/3] w-full overflow-hidden cursor-pointer bg-slate-100" onclick="toggleAlbum('${albumId}')">
              <img src="${coverPhoto.thumbnailUrl}" loading="lazy" referrerpolicy="no-referrer" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
              <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent"></div>
              
              <div class="absolute bottom-0 left-0 right-0 p-4">
                <div class="flex justify-between items-end gap-2">
                  <h3 class="text-white font-bold text-sm sm:text-base leading-tight drop-shadow-md line-clamp-2">${event.name}</h3>
                  <div class="bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20 text-white text-[11px] font-semibold flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i> ${event.photos.length} ภาพ
                  </div>
                </div>
              </div>
            </div>

            <!-- ส่วนกางรูปภาพออก (ซ่อนอยู่ตอนแรก) -->
            <div id="${albumId}" class="hidden bg-slate-50 border-t border-slate-100 p-4">
              <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-80 overflow-y-auto scrollbar-hide pr-1">
                ${event.photos.map(photo => `
                  <div class="aspect-square rounded-xl overflow-hidden relative group/item bg-slate-200 cursor-pointer" onclick="openLightbox('${photo.thumbnailUrl.replace('w800', 'w1600')}', '${photo.name}', '${photo.downloadUrl}')">
                    <img src="${photo.thumbnailUrl}" loading="lazy" referrerpolicy="no-referrer" class="w-full h-full object-cover group-hover/item:scale-110 transition-transform duration-300"/>
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center justify-center">
                      <i data-lucide="zoom-in" class="w-5 h-5 text-white"></i>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="mt-3 text-center">
                 <button onclick="toggleAlbum('${albumId}')" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors bg-white px-4 py-1.5 rounded-full border border-slate-200 shadow-sm">พับเก็บ</button>
              </div>
            </div>
          `;
          
          albumGrid.appendChild(card);
        });

        section.appendChild(albumGrid);
        container.appendChild(section);
      });

      lucide.createIcons();
    }

    // ฟังก์ชันเปิด-ปิดอัลบั้ม
    window.toggleAlbum = function(id) {
      const el = document.getElementById(id);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    };

    // ฟังก์ชัน Lightbox
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('modalImage');
    function openLightbox(imgSrc, name, downloadUrl) {
      modalImg.src = imgSrc;
      document.getElementById('modalImageName').textContent = name;
      document.getElementById('modalDownloadBtn').href = downloadUrl;
      document.getElementById('modalDownloadBtn').setAttribute('download', name);
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.classList.add('opacity-100', 'pointer-events-auto');
      }, 10);
    }
    window.closeLightbox = function() {
      modal.classList.remove('opacity-100', 'pointer-events-auto');
      modal.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => { modal.classList.add('hidden'); modalImg.src = ''; }, 300);
    };

    loadData();
  </script>
</body>
</html>
